name: Discover Clocks

# Narrow, frequent sweep: 'clock language:dart' only, same AI evaluation and
# PR flow as the broad Discover Showcases run. Star ranges are preserved
# (SEARCH_KEYWORD just swaps the keyword) so the 1000-result GitHub API window
# never truncates coverage — repos with 0 stars are still reached and evaluated.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      github_user:
        description: 'GitHub username - evaluate all their Flutter repos'
        required: false
        default: ''
      repo_url:
        description: 'Single repo URL to evaluate directly'
        required: false
        default: ''
      force_reevaluate:
        description: 'Skip submitted check'
        required: false
        default: 'false'

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Flutter (includes Dart)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run discovery agent
        env:
          GH_TOKEN: ${{ secrets.SHOWCASE_DISCOVERY_PAT }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          DEEPSEEK_API_KEYS: ${{ secrets.DEEPSEEK_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
          SAMBANOVA_API_KEYS: ${{ secrets.SAMBANOVA_API_KEYS }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
          TOGETHER_API_KEYS: ${{ secrets.TOGETHER_API_KEYS }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          MISTRAL_API_KEYS: ${{ secrets.MISTRAL_API_KEYS }}
          SHOWCASE_REPO: flexer-io/flexer-gallery
          SEARCH_KEYWORD: clock
          TARGET_USER: ${{ github.event.inputs.github_user }}
          TARGET_REPO: ${{ github.event.inputs.repo_url }}
          FORCE_REEVALUATE: ${{ github.event.inputs.force_reevaluate }}
        run: |
          sed -i '/^resolution: workspace/d' pubspec.yaml
          dart run scripts/discover_showcases.dart
