name: Validate Showcase PR

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect showcase folder
        id: detect
        run: |
          SHOWCASE_ID=$(git diff --name-only origin/main...HEAD \
            | grep '^lib/' \
            | awk -F'/' '{print $2}' \
            | sort -u \
            | grep -v '^$' \
            | head -1)

          if [ -z "$SHOWCASE_ID" ]; then
            echo "ERROR: No showcase folder detected under lib/."
            exit 1
          fi

          echo "showcase_id=$SHOWCASE_ID" >> "$GITHUB_OUTPUT"
          echo "Detected showcase: $SHOWCASE_ID"

      - name: Validate structure
        run: |
          ID="${{ steps.detect.outputs.showcase_id }}"

          if [ ! -f "lib/$ID/${ID}_page.dart" ]; then
            echo "ERROR: missing lib/$ID/${ID}_page.dart"
            exit 1
          fi

          if [ ! -f "lib/$ID/showcase_info.dart" ]; then
            echo "ERROR: missing lib/$ID/showcase_info.dart"
            exit 1
          fi

          echo "Structure valid."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Check for duplicate repo URL
        run: |
          ID="${{ steps.detect.outputs.showcase_id }}"
          INFO="lib/$ID/showcase_info.dart"

          REPO_URL=$(grep "githubRepoUrl:" "$INFO" | head -1 \
            | sed "s/.*githubRepoUrl: *'//;s/'.*//")

          if [ -z "$REPO_URL" ]; then
            echo "ERROR: githubRepoUrl not found in showcase_info.dart"
            exit 1
          fi

          echo "Repo URL: $REPO_URL"

          DUPLICATE=$(find lib -name "showcase_info.dart" \
            ! -path "lib/$ID/*" \
            | xargs grep -l "githubRepoUrl: '$REPO_URL'" 2>/dev/null || true)

          if [ -n "$DUPLICATE" ]; then
            echo "ERROR: a showcase from '$REPO_URL' already exists:"
            echo "$DUPLICATE"
            exit 1
          fi

          echo "No duplicate found."
