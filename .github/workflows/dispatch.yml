# Place this file at .github/workflows/dispatch.yml in the PUBLIC flexer-showcase-library repo.
# It fires when a showcase PR is merged and dispatches new_showcase to the private app repo.
#
# Required secret in the PUBLIC repo:
#   CORE_REPO_PAT — a GitHub PAT with repo scope on the private app repo.

name: Dispatch Showcase to App Repo

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  dispatch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect showcase ID
        id: detect
        run: |
          # Find directories added under lib/ in this PR
          SHOWCASE_ID=$(git diff --name-only HEAD~1 HEAD \
            | grep '^lib/' \
            | awk -F'/' '{print $2}' \
            | sort -u \
            | grep -v '^$' \
            | head -1)

          if [ -z "$SHOWCASE_ID" ]; then
            echo "No showcase folder detected — skipping dispatch."
            exit 1
          fi

          echo "showcase_id=$SHOWCASE_ID" >> "$GITHUB_OUTPUT"
          echo "Detected showcase: $SHOWCASE_ID"

      - name: Validate showcase structure
        run: |
          ID="${{ steps.detect.outputs.showcase_id }}"
          PAGE="lib/$ID/${ID}_page.dart"
          INFO="lib/$ID/showcase_info.dart"

          if [ ! -f "$PAGE" ]; then
            echo "ERROR: missing $PAGE"
            exit 1
          fi

          if [ ! -f "$INFO" ]; then
            echo "ERROR: missing $INFO"
            exit 1
          fi

          echo "Structure valid for $ID"

      - name: Dispatch to private app repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CORE_REPO_PAT }}
          repository: flexer/flexer
          event-type: new_showcase
          client-payload: '{"showcase_id": "${{ steps.detect.outputs.showcase_id }}"}'
