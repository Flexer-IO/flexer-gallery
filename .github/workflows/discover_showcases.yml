name: Discover Showcases

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  discover:
    runs-on: ubuntu-latest
    # No timeout — script caps itself at _maxCandidatesToEvaluate=12.
    # GitHub's default job timeout (6h) handles true hangs.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (includes Dart)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run discovery agent
        env:
          GH_TOKEN: ${{ secrets.SHOWCASE_DISCOVERY_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHOWCASE_REPO: flexer-io/flexer-gallery

        run: dart run scripts/discover_showcases.dart
