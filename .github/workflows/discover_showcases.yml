name: Discover Showcases

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      github_user:
        description: 'GitHub username — evaluate all their Flutter repos'
        required: false
        default: ''
      repo_url:
        description: 'Single repo URL to evaluate directly (e.g. https://github.com/user/repo)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (includes Dart)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run discovery agent
        env:
          GH_TOKEN: ${{ secrets.SHOWCASE_DISCOVERY_PAT }}
          # AI providers — add any you have; all are free, multiple keys multiply rate limits
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}       # ai.google.dev
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}           # console.groq.com
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}   # cloud.cerebras.ai
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }} # openrouter.ai
          MISTRAL_API_KEYS: ${{ secrets.MISTRAL_API_KEYS }}     # console.mistral.ai
          SHOWCASE_REPO: flexer-io/flexer-gallery
          TARGET_USER: ${{ github.event.inputs.github_user }}
          TARGET_REPO: ${{ github.event.inputs.repo_url }}

        run: dart run scripts/discover_showcases.dart
