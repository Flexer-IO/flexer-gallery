name: Discover Showcases

on:
  schedule:
    # Every 6 hours — free on GitHub Actions.
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI.

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (includes Dart)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run discovery agent
        env:
          # PAT needs repo scope on both flexer/flexer and flexer/flexer-showcase-library.
          # Create at: https://github.com/settings/tokens
          # Store at:  Settings → Secrets → Actions → SHOWCASE_DISCOVERY_PAT
          GH_TOKEN: ${{ secrets.SHOWCASE_DISCOVERY_PAT }}

          # Free key from: https://aistudio.google.com/apikey
          # Store at:  Settings → Secrets → Actions → GEMINI_API_KEY
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          SHOWCASE_REPO: flexer/flexer-showcase-library

        run: dart run scripts/discover_showcases.dart
