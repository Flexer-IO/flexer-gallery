  plugin_platform_interface:
    path: lib/ahsanalidev_flutter_clock/deps/plugin_platform_interface
  platform:
    path: lib/ahsanalidev_flutter_clock/deps/platform
  http:
    path: lib/ahsanalidev_flutter_clock/deps/http
  web:
    path: lib/ahsanalidev_flutter_clock/deps/web
