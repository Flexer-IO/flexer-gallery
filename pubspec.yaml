name: showcase_library
resolution: workspace
description: "Flexer public showcase library — community UI masterclasses"
publish_to: none
environment:
  sdk: ^3.12.0

dependencies:
  intl:
    path: lib/alohadance265_pacman_clock/deps/intl
  clock:
    path:
    path: lib/alohadance265_pacman_clock/deps/path
